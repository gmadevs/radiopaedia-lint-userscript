<svg xmlns="http://www.w3.org/2000/svg" viewBox="92 92 840 840" width="512" height="512" role="img" aria-label="Radiopaedia Lint">
  <!-- A broom, and the lit point it sweeps.
       Same family as the Radiouploader and Radiowriter marks: a midnight-blue
       rounded square, a grey shape, and one lit blue point. -->
  <defs>
    <radialGradient id="spark" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#8fe9ff"/>
      <stop offset="0.55" stop-color="#3fb4ff"/>
      <stop offset="1" stop-color="#1e8fff"/>
    </radialGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <rect x="92" y="92" width="840" height="840" rx="196" fill="#0d1f3c"/>
  <!-- the broom, drawn upright and then leaned -->
  <g transform="rotate(38 512 512)">
    <rect x="490" y="150" width="44" height="400" rx="22" fill="#b7b9be"/>
    <rect x="428" y="520" width="168" height="62" rx="20" fill="#a0a3a9"/>
    <path fill="#b7b9be" d="M436 582 L588 582 L640 790 Q644 808 626 808 L398 808 Q380 808 384 790 Z"/>
    <g fill="none" stroke="#a0a3a9" stroke-width="14" stroke-linecap="round">
      <path d="M472 624 L452 770"/>
      <path d="M512 624 L512 770"/>
      <path d="M552 624 L572 770"/>
    </g>
  </g>
  <circle cx="690" cy="720" r="58" fill="#2aa5ff" opacity="0.55" filter="url(#glow)"/>
  <g fill="none" stroke="#35aaff" stroke-width="9" stroke-linecap="round" transform="translate(178 148)">
    <path d="M490 500 C492 482 480 472 484 452"/>
    <path d="M512 492 C518 470 504 456 512 430"/>
    <path d="M534 500 C532 482 544 472 540 452"/>
  </g>
  <circle cx="690" cy="720" r="45" fill="url(#spark)"/>
</svg>
